[workspace]

[package]
name = "iroh-lab"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
# Exactly as docs/ARCHITECTURE.md prescribes. Never iroh/test-utils.
iroh = { version = "1.5", default-features = false, features = ["tls-ring"] }
# Lab only: the dev tower. `server` implies tls-ring and metrics.
iroh-relay = { version = "1.5", default-features = false, features = ["server"] }
n0-future = "0.3"
n0-error = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
# M2 (tests/m2.rs): the TLS tower's server config, and SRV. Versions already in the workspace lock.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
n0-dns-resolver = { version = "0.1", default-features = false }

[dev-dependencies]
tempfile = "3"
# M2: a test certificate, and the fake DNS server (both already in this lock via iroh-relay/n0-dns-resolver).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
simple-dns = "0.13"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"

[features]
# Compiles the snippets exactly as written in docs/notes/iroh-snippets.md (expected to fail).
verbatim = []
# M2 lab only: T21 also reads Endpoint::net_report() (unstable API). Never in the workspace.
net-report = ["iroh/unstable-net-report"]
