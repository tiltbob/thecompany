[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
# Internal crates.
numbers-base = { path = "crates/base" }
numbers = { path = "crates/numbers" }
chief = { path = "crates/chief" }
numbers-station = { path = "crates/station" }
numbers-tower = { path = "crates/tower" }

# iroh without default features (no portmapper, metrics or fast-apple-datapath); tls-ring is
# required for `presets::Minimal`. See docs/ARCHITECTURE.md, appendix "Dependencies".
iroh = { version = "1.5", default-features = false, features = ["tls-ring"] }
# Only the endpoint id type (`key`), for the tower's allowlist.
iroh-base = { version = "1.5.0", default-features = false, features = ["key"] }
iroh-relay = { version = "1.5", default-features = false, features = ["tls-ring"] }

clap = { version = "4", features = ["derive"] }
# The SRV lookup in `numbers::bootstrap`. No default features: those add DNS over TLS and HTTPS
# (reqwest, tokio-rustls, webpki-roots), which the plain UDP/TCP lookup does not use.
n0-dns-resolver = { version = "0.1.1", default-features = false }
n0-future = "0.3"
# Safe Unix syscalls (`geteuid`, `openat`, `linkat`) without `unsafe`. Each crate picks the modules
# it needs; `std` keeps `From<Errno> for std::io::Error`.
rustix = { version = "1.1.6", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = "1.0.229"
serde_json = "1.0.154"
# The fake DNS server behind `numbers`' `test-support` feature. Default features: `std`.
simple-dns = "0.13.1"
thiserror = "2"
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"

# Dev-dependencies.
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
# The confinement lint (hard rule 1; the types are listed in clippy.toml). Denied here, not left to
# `-D warnings`, so a blanket `allow(warnings)` cannot lower it: that only reaches lints at warn level.
disallowed_types = "deny"
