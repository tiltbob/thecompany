[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
# Internal crates.
numbers-base = { path = "crates/base" }
numbers = { path = "crates/numbers" }
chief = { path = "crates/chief" }
numbers-station = { path = "crates/station" }

# iroh without default features (no portmapper, metrics or fast-apple-datapath); tls-ring is
# required for `presets::Minimal`. See docs/ARCHITECTURE.md, appendix "Dependencies".
iroh = { version = "1.5", default-features = false, features = ["tls-ring"] }

# Leaf-crate dependencies (numbers-base first). Each crate enables the features it needs.
serde = "1.0.229"
serde_json = "1.0.154"
# No default features (tokio has none anyway): each crate names the ones it uses.
tokio = { version = "1.54", default-features = false }
# Safe Unix syscalls (`geteuid`, `open` with `O_NOFOLLOW`) without `unsafe`. Each crate picks the
# modules it needs; `std` keeps `From<Errno> for std::io::Error`.
rustix = { version = "1.1.6", default-features = false, features = ["std"] }

# Dev-dependencies.
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
