[package]
name = "numbers-base"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# A leaf crate: frontends depend on it, so no iroh and no network code. tokio only for its I/O
# traits and timers; never `net`, `process`, `rt-multi-thread` or `full`.
[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "time"] }
url.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
tempfile.workspace = true
# `test-util` for `start_paused`, so deadline tests never sleep for real.
tokio = { workspace = true, features = ["io-util", "macros", "rt", "test-util", "time"] }

[lints]
workspace = true
