[package]
name = "chief-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The whole CLI is a library, so that tests run every command in-process: no test may start the
# binary (hard rule 1 forbids naming a process-spawning type anywhere outside `safehouse`).
[lib]
name = "chief_cli"
path = "src/lib.rs"

[[bin]]
name = "chief"
path = "src/main.rs"
doc = false

[dependencies]
chief.workspace = true
clap.workspace = true
# `rt` and `io-std` for the binary's runtime and stdin, `io-util` for reading lines, `macros` for
# `select!` in `chat`; never `process`.
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt"] }

[dev-dependencies]
chief = { workspace = true, features = ["fake"] }
# Only for tests/socket.rs: the real socket server (`numbers_station::ipc::IpcServer`) serving a
# fake station, so a few tests go through the socket exactly as the binary does. A dev-dependency
# never ships; `[dependencies]` stays free of `numbers` and iroh (hard rule 5).
numbers-station.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }

[lints]
workspace = true
