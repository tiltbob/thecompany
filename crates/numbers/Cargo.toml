[package]
name = "numbers"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `numbers::testing`: a fake DNS server on 127.0.0.1 for tests of this crate and of the station.
# Off by default; nothing that ships enables it.
test-support = ["dep:simple-dns", "tokio/net"]

[dependencies]
base64.workspace = true
numbers-base.workspace = true
iroh.workspace = true
iroh-relay.workspace = true
n0-dns-resolver.workspace = true
n0-future.workspace = true
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
simple-dns = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
url.workspace = true

[dev-dependencies]
# The crate itself with `testing`, for its integration tests.
numbers = { workspace = true, features = ["test-support"] }
numbers-tower.workspace = true
rcgen.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
