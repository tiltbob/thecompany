[package]
name = "chief"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `chief::fake`: an in-memory station for tests of transports, the socket server and frontends.
# Off by default; nothing that ships enables it.
fake = ["dep:serde_json"]

[dependencies]
numbers-base.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
# `net`, `io-util`, `time` and `rt` for the socket transport (`chief::socket`); never `process`.
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
# The crate itself with the fake station, for its integration tests.
chief = { workspace = true, features = ["fake"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
